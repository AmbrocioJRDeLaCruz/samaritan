<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Samaritan</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
  </head>
</head>
<body style="background-color: #eceff3;">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card rounded-4 shadow p-4"  style="width: 22rem;">
      <h1 class="text-center mb-4">Login</h1>
    
      <form id="login-form">
        <div class="mb-3">
          <input class="form-control rounded-4" type="email" id="email" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input class="form-control rounded-4" type="password" id="password" placeholder="password" required>
        </div>
    
        <button type="submit" class="btn btn-primary rounded-pill w-100">Login</button>
      </form>
    
      <p id="message"></p>
    </div>
    </div>
  
  <script src="js/auth.js"></script>
</body>
</html>
