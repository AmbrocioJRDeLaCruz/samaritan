<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beneficiaries - Samaritan</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container my-5">
    <h1 class="display-5 fw-bold text-primary mb-4">Beneficiaries</h1>
  
    <div class="card shadow-sm border-0 rounded-3 mb-5">
      <div class="card-body p-4">
        <h5 class="card-title mb-4 text-muted">Register New Beneficiary</h5>
        <p class="card-text text-muted">This page allows you to register beneficiaries for the Samaritan program. Please fill in the details below and click "Add beneficiary" to register a new beneficiary.</p>
        
        <form id="beneficiary-form" class="row g-3">

          <div class="col-md-6">
            <label for="name" class="form-label fw-semibolb">Full Name</label>
            <input type="text" id="name" class="form-control rounded-4" placeholder="Name" required>
          </div>

          <div class="col-md-6">
            <label for="phone" class="form-label fw-semibold">Phone Number</label>
            <input type="text" id="phone" class="form-control rounded-4" placeholder="Phone">
          </div>

          <div class="col-md-8">
            <label for="location" class="form-label fw-semibold">Location / Address</label>
            <input type="text" id="location" class="form-control rounded-4" placeholder="e.g New York, USA">
          </div>

          <div class="col-md-4">
            <label for="household_size" class="form-label fw-semibold">Household Size</label>
            <input type="number" id="household_size" class="form-control rounded-4" placeholder="Household size">
          </div>
      
          <div class="col-12 text-end mt-4">
            <button type="submit" class="btn btn-primary px-4 py-2 fw-bold shadow-sm rounded-pill">Add benficiary</button>
          </div>
        </form>
      </div>
    </div>
  
    <p id="message" class="alert alert-info d-none" role="alert"></p>
  
    <hr class="my-5 opacity-25">
  
    <h2 class="h3 fw-bold text-secondary mb-4">Registered beneficiaries</h2>
  
    <div id="beneficiaries-list" class="row g-3"></div>
  </div>
  

  <script src="js/beneficiaries.js"></script>
</body>
</html>
