{% extends "layout.html" %}

{% block title %}Registrar Necesidad - Samaritan{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">
        <div class="card border-0 shadow-sm rounded-4 bg-white">
            <div class="card-header bg-white py-3 border-bottom">
                <h4 class="fw-bold mb-0 text-primary">
                    <i class="bi bi-file-earmark-plus me-2"></i>Registrar Caso de Ayuda
                </h4>
                <p class="text-muted small mb-0 mt-1">Registra una necesidad específica para coordinar la ayuda comunitaria</p>
            </div>
            <div class="card-body p-4">
                <form action="/cases/new" method="post">
                    <!-- Selección de Beneficiario -->
                    <div class="mb-3">
                        <label for="beneficiary_id" class="form-label fw-semibold">Beneficiario / Familia <span class="text-danger">*</span></label>
                        <select class="form-select" id="beneficiary_id" name="beneficiary_id" required>
                            <option value="" disabled {% if not selected_beneficiary_id %}selected{% endif %}>Selecciona una familia o persona...</option>
                            {% for b in beneficiaries %}
                                <option value="{{ b['id'] }}" {% if selected_beneficiary_id and selected_beneficiary_id|int == b['id'] %}selected{% endif %}>
                                    {{ b["name"] }} {% if b["location"] %}({{ b["location"] }}){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text small">¿No está en la lista? <a href="/beneficiaries">Registra primero al beneficiario</a>.</div>
                    </div>

                    <!-- Título de la necesidad -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Título del Caso o Necesidad <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="Ej. Canasta de alimentos no perecederos" required>
                    </div>

                    <!-- Categoría -->
                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Categoría de Ayuda <span class="text-danger">*</span></label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="Alimentos">Alimentos y Nutrición</option>
                            <option value="Salud">Salud y Medicamentos</option>
                            <option value="Vivienda">Vivienda y Reparaciones</option>
                            <option value="Ropa">Ropa y Calzado</option>
                            <option value="Educación">Educación y Útiles Escolares</option>
                            <option value="Económica">Apoyo Económico de Emergencia</option>
                            <option value="Otro">Otro Tipo de Apoyo</option>
                        </select>
                    </div>

                    <!-- Descripción detallada -->
                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Descripción Detallada</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Explica la situación, urgencia, o recursos específicos necesarios..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i>Guardar Caso
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
